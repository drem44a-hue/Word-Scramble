<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORD SCRAMBLE v1000 - ULTIMATE</title>
    <style>
        :root { --main: #00ff41; --bg: #050505; --card: #0d0d0d; --text: #00ff41; }
        body { background: var(--bg); color: var(--text); font-family: 'Courier New', Courier, monospace; margin: 0; overflow: hidden; }
        .cyber-card { border: 2px solid var(--main); background: var(--card); padding: 40px; border-radius: 5px; box-shadow: 0 0 20px var(--main); width: 100%; max-width: 500px; text-align: center; position: relative; }
        .container { height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, #003300 0%, #000000 100%); }
        input { background: transparent; border: 1px solid var(--main); color: var(--main); padding: 15px; width: 80%; margin: 10px 0; outline: none; text-align: center; font-size: 1.2rem; }
        button { background: var(--main); color: black; border: none; padding: 15px 30px; cursor: pointer; font-weight: bold; width: 80%; transition: 0.3s; margin-top: 10px; }
        button:hover { background: white; box-shadow: 0 0 15px white; }
        #word-screen { font-size: 3.5rem; font-weight: bold; margin: 30px 0; text-transform: uppercase; letter-spacing: 12px; }
        .leaderboard { margin-top: 20px; font-size: 0.8rem; border-top: 1px solid var(--main); padding-top: 10px; text-align: right; }
        .win-overlay { position: fixed; inset: 0; background: black; z-index: 999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .status-msg { height: 20px; font-size: 0.9rem; margin-top: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="win-screen" class="win-overlay">
    <h1 style="font-size: 5rem; text-shadow: 0 0 20px var(--main);">ACCESS GRANTED</h1>
    <p>تم سحق النظام - أنت المتصدر الآن</p>
    <button onclick="location.reload()" style="width: 200px;">إعادة تشغيل</button>
</div>

<div class="container">
    <div class="cyber-card" id="auth-box">
        <h2 id="header">CORE LOGIN</h2>
        <input type="text" id="uid" placeholder="AUTH_ID">
        <input type="password" id="pid" placeholder="SECRET_PASS">
        <button onclick="executeAuth()">ENTER SYSTEM</button>
        <p id="mode-toggle" style="font-size:10px; cursor:pointer; margin-top:15px;" onclick="toggle()">NEW_USER_REGISTRATION</p>
    </div>

    <div class="cyber-card hidden" id="game-box">
        <div style="display:flex; justify-content: space-between;">
            <span id="player-label">USER: ???</span>
            <span>XP: <b id="xp-val">0</b>/1000</span>
        </div>
        <div id="word-screen">----</div>
        <input type="text" id="ans-input" placeholder="DECRYPT_WORD" autocomplete="off">
        <button onclick="verify()">SUBMIT_DECRYPTION</button>
        <div class="status-msg" id="msg"></div>

        <div class="leaderboard">
            <div id="lb-content"></div>
        </div>
    </div>
</div>

<script>
    // نظام الحماية والكلمات (v1000)
    const _ROOT = btoa("team"); 
    const _KEY = btoa("team");
    let isReg = false;
    let verified = false;
    let score = 0;
    let activeWord = "";

    // عينة من 1000 كلمة (مختصرة برمجياً لسرعة التحميل)
    const db = ["خوارزمية", "برمجة", "تشفير", "سيبراني", "سيرفر", "اختراق", "تطوير", "تقنية", "واجهة", "قاعدة", "بيانات", "اتصال", "معالج", "تخزين", "تشفير", "حماية", "شبكة", "نظام", "ذكاء", "اصطناعي", "منطق", "بروتوكول", "توجيه", "ثغرة", "تحديث"];
    // لزيادة الكلمات، يتم إضافة الكلمات في المصفوفة أعلاه.

    function toggle() {
        isReg = !isReg;
        document.getElementById('header').innerText = isReg ? "REGISTER_USER" : "CORE LOGIN";
        document.getElementById('mode-toggle').innerText = isReg ? "BACK_TO_LOGIN" : "NEW_USER_REGISTRATION";
    }

    function executeAuth() {
        const u = document.getElementById('uid').value;
        const p = document.getElementById('pid').value;

        if (btoa(u) === _ROOT && btoa(p) === _KEY) {
            startSession("ADMIN_TEAM_V1000");
        } else if (isReg) {
            localStorage.setItem("cy_" + btoa(u), btoa(p));
            alert("CREDENTIALS_STORED");
            toggle();
        } else {
            if (localStorage.getItem("cy_" + btoa(u)) === btoa(p)) {
                startSession(u);
            } else {
                alert("ACCESS_DENIED");
            }
        }
    }

    function startSession(user) {
        verified = true;
        document.getElementById('auth-box').classList.add('hidden');
        document.getElementById('game-box').classList.remove('hidden');
        document.getElementById('player-label').innerText = "ID: " + user;
        loadLB();
        nextTask();
    }

    function nextTask() {
        if (!verified) return;
        activeWord = db[Math.floor(Math.random() * db.length)];
        let scrambled = activeWord.split('').sort(() => Math.random() - 0.5).join('');
        document.getElementById('word-screen').innerText = scrambled;
        document.getElementById('ans-input').value = "";
    }

    function verify() {
        if (!verified) return;
        const userAns = document.getElementById('ans-input').value;
        if (userAns === activeWord) {
            score += 100; // زيادة الرتبة
            document.getElementById('xp-val').innerText = score;
            document.getElementById('msg').innerText = ">>> DECRYPTION_SUCCESSFUL";
            document.getElementById('msg').style.color = "var(--main)";
            saveAndRank();
            if (score >= 1000) {
                document.getElementById('win-screen').style.display = 'flex';
            } else {
                setTimeout(nextTask, 800);
            }
        } else {
            document.getElementById('msg').innerText = ">>> ERROR_INVALID_SEQ";
            document.getElementById('msg').style.color = "red";
        }
    }

    function saveAndRank() {
        let lb = JSON.parse(localStorage.getItem('v1000_lb')) || [];
        let u = document.getElementById('player-label').innerText.split(": ")[1];
        let exist = lb.findIndex(x => x.n === u);
        if (exist > -1) { if(score > lb[exist].s) lb[exist].s = score; }
        else { lb.push({n: u, s: score}); }
        lb.sort((a,b) => b.s - a.s);
        localStorage.setItem('v1000_lb', JSON.stringify(lb.slice(0,5)));
        loadLB();
    }

    function loadLB() {
        let lb = JSON.parse(localStorage.getItem('v1000_lb')) || [];
        document.getElementById('lb-content').innerHTML = "RANKINGS:<br>" + lb.map(p => `[${p.n}] --- ${p.s} XP`).join('<br>');
    }

    // Anti-Cheat: منع الـ Right Click والـ F12
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.onkeydown = function(e) {
        if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73)) return false;
    };
</script>
</body>
</html>
