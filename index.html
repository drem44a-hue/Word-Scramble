<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام الكلمات المتكامل v1000</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2fe; --gold: #ffcf33; --bg: #050505; --glass: rgba(255, 255, 255, 0.05); }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); color: white; overflow-x: hidden; }
        
        /* شريط التنقل العلوي */
        .navbar { background: rgba(0,0,0,0.9); padding: 15px; display: flex; justify-content: center; gap: 15px; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 1000; }
        .nav-btn { background: var(--glass); border: 1px solid #444; color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .nav-btn.active { background: var(--neon); color: black; border-color: var(--neon); }

        .container { max-width: 800px; margin: 40px auto; padding: 20px; text-align: center; }
        .card { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); padding: 30px; border-radius: 20px; }
        
        input { padding: 12px; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff; text-align: center; margin: 10px; width: 80%; max-width: 300px; }
        .btn-main { background: var(--gold); color: black; padding: 12px 30px; border: none; border-radius: 8px; font-weight: 900; cursor: pointer; font-size: 1.1rem; }
        
        .word-display { font-size: 3.5rem; color: var(--gold); letter-spacing: 12px; margin: 30px 0; text-shadow: 0 0 20px rgba(255,207,51,0.4); }
        .stats { display: flex; justify-content: space-around; margin-bottom: 20px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; color: var(--neon); font-weight: bold; }
        
        .hidden { display: none; }
        .item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .item { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; border: 1px solid #333; }
    </style>
</head>
<body>

    <nav class="navbar">
        <button class="nav-btn active" onclick="showTab('solo')">👤 لعب فردي</button>
        <button class="nav-btn" onclick="showTab('multi')">⚔️ أونلاين</button>
        <button class="nav-btn" onclick="showTab('store')">🛒 المتجر</button>
    </nav>

    <div class="container">
        <div class="stats">
            <span>اللاعب: <span id="ui-name">زائر</span></span>
            <span>الرصيد: <span id="ui-xp">0</span> XP</span>
        </div>

        <div id="tab-solo" class="tab-content card">
            <h2>التحدي الفردي</h2>
            <div class="word-display" id="solo-word">----</div>
            <input type="text" id="solo-input" placeholder="اكتب الحل...">
            <br>
            <button class="btn-main" onclick="checkSolo()">تحقق</button>
        </div>

        <div id="tab-multi" class="tab-content card hidden">
            <h2>تحدي الأصدقاء (Online)</h2>
            <div id="multi-setup">
                <input type="text" id="player-name" placeholder="اسمك">
                <input type="text" id="room-code" placeholder="كود الغرفة (مثلاً 123)">
                <br>
                <button class="btn-main" onclick="initMulti()">دخول الغرفة</button>
            </div>
            <div id="multi-game" class="hidden">
                <p style="color: #888;">أنت في غرفة: <b id="room-id-view" style="color:var(--neon)"></b></p>
                <div id="opponents" style="margin-bottom: 10px; font-size: 0.9rem;"></div>
                <div class="word-display" id="multi-word">----</div>
                <input type="text" id="multi-input" placeholder="سابق صديقك في الحل!">
                <br>
                <button class="btn-main" onclick="checkMulti()">إرسال</button>
            </div>
        </div>

        <div id="tab-store" class="tab-content card hidden">
            <h2>متجر الترقيات</h2>
            <div class="item-grid">
                <div class="item">
                    <h3>🔍 كاشف الحروف</h3>
                    <p>500 XP</p>
                    <button onclick="buy(500, 'كاشف')">شراء</button>
                </div>
                <div class="item">
                    <h3>🚀 مضاعف النقاط</h3>
                    <p>1200 XP</p>
                    <button onclick="buy(1200, 'مضاعف')">شراء</button>
                </div>
            </div>
        </div>
    </div>

<script>
    // --- الإعدادات والربط ---
    const DB_URL = "https://your-firebase-id.firebaseio.com/system"; // 👈 ضع رابطك هنا
    let myData = { name: "زائر", xp: 0, inventory: [] };
    let soloTarget = "";
    let multiTarget = "";
    let currentRoom = "";

    // --- نظام التنقل ---
    function showTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
        document.getElementById('tab-' + tabId).classList.remove('hidden');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
    }

    // --- اللعب الفردي ---
    function nextSolo() {
        const words = ["تقنية", "حاسوب", "مستقبل", "ذكاء", "تطوير"];
        soloTarget = words[Math.floor(Math.random()*words.length)];
        let scram = soloTarget.split('').sort(()=>Math.random()-0.5).join('');
        document.getElementById('solo-word').innerText = scram;
    }

    function checkSolo() {
        const val = document.getElementById('solo-input').value;
        if(val === soloTarget) {
            myData.xp += 100;
            updateUI();
            alert("صح! +100 نقطة");
            nextSolo();
            document.getElementById('solo-input').value = "";
        }
    }

    // --- نظام الأونلاين (المزامنة مع الصديق) ---
    async function initMulti() {
        myData.name = document.getElementById('player-name').value;
        currentRoom = document.getElementById('room-code').value;
        if(!myData.name || !currentRoom) return alert("أكمل البيانات");

        document.getElementById('multi-setup').classList.add('hidden');
        document.getElementById('multi-game').classList.remove('hidden');
        document.getElementById('room-id-view').innerText = currentRoom;
        document.getElementById('ui-name').innerText = myData.name;

        // إضافة اسمي للغرفة في السيرفر
        await fetch(`${DB_URL}/rooms/${currentRoom}/players/${myData.name}.json`, {
            method: 'PUT', body: JSON.stringify({ score: 0 })
        });

        setInterval(syncMulti, 2000); // تحديث كل ثانيتين
    }

    async function syncMulti() {
        const res = await fetch(`${DB_URL}/rooms/${currentRoom}.json`);
        const data = await res.json();
        if(!data) return;

        // تحديث الكلمة عند الجميع
        if(data.word) {
            multiTarget = data.word;
            document.getElementById('multi-word').innerText = data.scrambled;
        } else {
            generateRoomWord();
        }

        // تحديث قائمة اللاعبين
        let playersHtml = "";
        for(let p in data.players) {
            playersHtml += ` [ ${p}: ${data.players[p].score} ] `;
        }
        document.getElementById('opponents').innerHTML = playersHtml;
    }

    async function generateRoomWord() {
        const list = ["برمجة", "تشفير", "سيرفر", "اختراق"];
        const word = list[Math.floor(Math.random()*list.length)];
        const sc = word.split('').sort(()=>Math.random()-0.5).join('');
        await fetch(`${DB_URL}/rooms/${currentRoom}.json`, {
            method: 'PATCH', body: JSON.stringify({ word: word, scrambled: sc })
        });
    }

    async function checkMulti() {
        const val = document.getElementById('multi-input').value;
        if(val === multiTarget) {
            alert("أنت الأسرع! حصلت على النقاط");
            // مسح الكلمة لتتغير عند الجميع
            await fetch(`${DB_URL}/rooms/${currentRoom}/word.json`, { method: 'DELETE' });
            myData.xp += 200;
            updateUI();
        }
    }

    // --- المتجر والتحديث ---
    function updateUI() {
        document.getElementById('ui-xp').innerText = myData.xp;
        localStorage.setItem('my_save', JSON.stringify(myData));
    }

    function buy(price, name) {
        if(myData.xp >= price) {
            myData.xp -= price;
            myData.inventory.push(name);
            updateUI();
            alert("تم شراء " + name);
        } else { alert("رصيدك ناقص!"); }
    }

    // تشغيل اللعبة عند الفتح
    nextSolo();
</script>
</body>
</html>
