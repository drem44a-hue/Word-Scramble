<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة صائد الكلمات - نظام المتصدرين</title>
    <style>
        :root {
            --primary: #6366f1;
            --gold: #ffcf33;
            --bg: #0f172a;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }
        input {
            width: 80%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            background: #334155;
            color: white;
            font-size: 16px;
        }
        button {
            padding: 12px 25px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { opacity: 0.9; transform: scale(1.05); }
        .scrambled {
            font-size: 2.5rem;
            color: var(--gold);
            letter-spacing: 5px;
            margin: 20px 0;
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
        }
        .leaderboard {
            margin-top: 30px;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 10px;
            text-align: right;
        }
        .leader-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #334155;
        }
        #win-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .dev-badge {
            background: var(--gold);
            color: black;
            padding: 2px 8px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="win-screen">
        <h1 style="color: var(--gold); font-size: 3rem;">🏆 مبروك الفوز! 🏆</h1>
        <p>لقد وصلت إلى القمة وسيطرت على لوحة المتصدرين</p>
        <button onclick="location.reload()">العب مرة أخرى</button>
    </div>

    <div class="container">
        <div id="auth-ui">
            <h2>تسجيل الدخول / إنشاء حساب</h2>
            <input type="text" id="username" placeholder="اسم المستخدم">
            <input type="password" id="password" placeholder="كلمة المرور">
            <button onclick="login()">دخول</button>
            <p style="font-size: 12px; color: #94a3b8;">تلميح: جرب حساب المطور (team)</p>
        </div>

        <div id="game-ui" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span id="user-tag"></span>
                <span>النقاط: <strong id="score-display">0</strong> / 50</span>
            </div>
            
            <div class="scrambled" id="scrambled-word">----</div>
            <input type="text" id="guess-input" placeholder="رتب الكلمة هنا...">
            <button onclick="checkAnswer()">تحقق</button>
            <p id="feedback"></p>

            <div class="leaderboard">
                <h3 style="margin-top: 0; color: var(--gold);">🏅 قائمة المتصدرين</h3>
                <div id="leaders-list"></div>
            </div>
            <button onclick="location.reload()" style="background: #ef4444; margin-top: 15px; width: 100%;">خروج</button>
        </div>
    </div>

    <script>
        const words = ["برمج", "تطوير", "موقع", "جافاسكربت", "حاسوب", "تقنية", "كود", "مستقبل", "إبداع", "تعلم"];
        let currentWord = "";
        let currentUsername = "";
        let score = 0;

        // 1. نظام تسجيل الدخول (مع حساب المطور)
        function login() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (!user || !pass) return alert("أدخل البيانات!");

            // حساب المطور الخاص بك
            if (user === "team" && pass === "team") {
                currentUsername = "تيم 🛠️";
                startAsDev();
            } else {
                currentUsername = user;
                // إنشاء حساب تلقائي إذا لم يوجد
                if (!localStorage.getItem('user_' + user)) {
                    localStorage.setItem('user_' + user, pass);
                } else if (localStorage.getItem('user_' + user) !== pass) {
                    return alert("كلمة المرور خاطئة!");
                }
                startGame();
            }
        }

        function startGame() {
            document.getElementById('auth-ui').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            document.getElementById('user-tag').innerText = "اللاعب: " + currentUsername;
            updateLeaderboard();
            nextWord();
        }

        function startAsDev() {
            startGame();
            document.getElementById('user-tag').innerHTML = `<span class="dev-badge">مطور</span> ${currentUsername}`;
            console.log("Developer mode activated.");
        }

        // 2. نظام اللعبة
        function nextWord() {
            currentWord = words[Math.floor(Math.random() * words.length)];
            let scrambled = currentWord.split('').sort(() => Math.random() - 0.5).join('');
            document.getElementById('scrambled-word').innerText = scrambled;
            document.getElementById('guess-input').value = "";
        }

        function checkAnswer() {
            const guess = document.getElementById('guess-input').value.trim();
            const feedback = document.getElementById('feedback');

            if (guess === currentWord) {
                score += 10;
                document.getElementById('score-display').innerText = score;
                feedback.innerText = "✅ صحيح! +10 نقاط";
                feedback.style.color = "#4ade80";
                
                saveHighScore();
                updateLeaderboard();

                if (score >= 50) {
                    showWinScreen();
                } else {
                    setTimeout(nextWord, 1000);
                }
            } else {
                feedback.innerText = "❌ خطأ، حاول ثانية";
                feedback.style.color = "#f87171";
            }
        }

        // 3. نظام المتصدرين
        function saveHighScore() {
            let leaderboard = JSON.parse(localStorage.getItem('leaderboard')) || [];
            // تحديث سكور المستخدم الحالي
            let userIndex = leaderboard.findIndex(item => item.name === currentUsername);
            if (userIndex > -1) {
                if(score > leaderboard[userIndex].score) leaderboard[userIndex].score = score;
            } else {
                leaderboard.push({ name: currentUsername, score: score });
            }
            // ترتيب من الأعلى للأقل
            leaderboard.sort((a, b) => b.score - a.score);
            localStorage.setItem('leaderboard', JSON.stringify(leaderboard.slice(0, 5))); // حفظ أعلى 5 فقط
        }

        function updateLeaderboard() {
            let leaderboard = JSON.parse(localStorage.getItem('leaderboard')) || [];
            const listDiv = document.getElementById('leaders-list');
            listDiv.innerHTML = leaderboard.map((player, index) => `
                <div class="leader-item">
                    <span>${index + 1}. ${player.name}</span>
                    <span style="color:var(--gold)">${player.score} ن</span>
                </div>
            `).join('');
        }

        function showWinScreen() {
            document.getElementById('win-screen').style.display = 'flex';
        }

        // دعم الـ Enter
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkAnswer();
        });
    </script>
</body>
</html>
