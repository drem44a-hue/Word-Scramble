<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER NEXUS v3000 | النظام المتكامل</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2fe; --secondary: #4facfe; --accent: #ffcf33;
            --bg-dark: #0a0a0f; --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
        body {
            margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg-dark); color: white;
            min-height: 100vh; overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 50%, rgba(79, 172, 254, 0.1) 0%, transparent 60%),
                              radial-gradient(circle at 80% 20%, rgba(255, 207, 51, 0.05) 0%, transparent 40%);
            background-size: 200% 200%; animation: bgShift 15s ease infinite;
        }
        @keyframes bgShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* --- نظام الإشعارات الجميل --- */
        #toast-container { position: fixed; top: 20px; left: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); border-right: 4px solid var(--primary); padding: 15px 25px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); animation: slideIn 0.3s ease; }
        .toast.success { border-color: var(--primary); color: var(--primary); }
        .toast.error { border-color: #ff4b2b; color: #ff4b2b; }
        .toast.gold { border-color: var(--accent); color: var(--accent); }
        @keyframes slideIn { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* --- شاشة الدخول --- */
        .auth-overlay { position: fixed; inset: 0; background: rgba(10,10,15,0.9); backdrop-filter: blur(20px); z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .glass-panel { background: var(--glass); border: 1px solid var(--glass-border); padding: 40px; border-radius: 24px; box-shadow: 0 0 40px rgba(0, 242, 254, 0.1); text-align: center; max-width: 450px; width: 90%; }
        h1.cyber-title { font-weight: 800; font-size: 2.5rem; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; }

        /* --- عناصر الواجهة --- */
        input.cyber-input { width: 100%; padding: 15px; margin: 10px 0; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: 12px; color: white; font-family: inherit; outline: none; text-align: center; font-size: 1.1rem; }
        input.cyber-input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 242, 254, 0.2); }
        
        button.cyber-btn { width: 100%; padding: 15px; margin-top: 10px; border: none; border-radius: 12px; font-weight: 800; font-size: 1.1rem; cursor: pointer; position: relative; overflow: hidden; font-family: inherit; }
        .btn-primary { background: linear-gradient(45deg, var(--primary), var(--secondary)); color: #000; }
        .btn-gold { background: linear-gradient(45deg, var(--accent), #ffae00); color: #000; }
        .cyber-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0, 242, 254, 0.3); }
        .cyber-btn:active { transform: translateY(0); }

        /* --- التطبيق الرئيسي --- */
        .main-container { max-width: 900px; margin: 30px auto; padding: 20px; }
        .status-bar { display: flex; justify-content: space-between; background: var(--glass); padding: 20px; border-radius: 16px; margin-bottom: 20px; border: 1px solid var(--glass-border); font-weight: bold; }
        
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 25px; justify-content: center; }
        .tab-btn { background: var(--glass); border: 1px solid var(--glass-border); color: #888; padding: 12px 25px; border-radius: 12px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: rgba(0, 242, 254, 0.1); color: var(--primary); border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 242, 254, 0.1); }

        .tab-content { display: none; animation: fadeUp 0.5s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .game-card { background: var(--glass); border: 1px solid var(--glass-border); padding: 40px; border-radius: 24px; text-align: center; }
        .word-display { font-size: 4rem; font-weight: 900; color: var(--accent); letter-spacing: 12px; margin: 30px 0; text-shadow: 0 0 25px rgba(255, 207, 51, 0.4); }

        .store-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .store-item { background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); padding: 25px; border-radius: 20px; text-align: center; position: relative; }
        .store-item.owned { border-color: var(--accent); opacity: 0.7; }
        .store-item.owned::after { content: 'مملوك'; position: absolute; top: 10px; left: 10px; background: var(--accent); color: black; padding: 2px 10px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div id="auth-screen" class="auth-overlay">
        <div class="glass-panel">
            <h1 class="cyber-title">CYBER NEXUS</h1>
            <p style="color: #aaa; margin-bottom: 30px;">بوابتك إلى العالم الرقمي</p>
            <input type="text" id="u-name" class="cyber-input" placeholder="اسم المستخدم (Username)">
            <input type="password" id="u-pass" class="cyber-input" placeholder="كلمة المرور (Password)">
            <button class="cyber-btn btn-primary" onclick="attemptLogin()">دخول النظام</button>
            <button class="cyber-btn" onclick="attemptRegister()" style="background: transparent; border: 1px solid var(--secondary); color: var(--secondary); margin-top: 15px;">إنشاء هوية جديدة</button>
        </div>
    </div>

    <div id="main-app" class="main-container hidden">
        <div class="status-bar">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span style="background: var(--primary); width: 10px; height: 10px; border-radius: 50%; display: inline-block; box-shadow: 0 0 10px var(--primary);"></span>
                <span id="user-display" style="color: var(--primary);">---</span>
            </div>
            <div style="color: var(--accent);">
                الرصيد: <span id="xp-display" style="font-size: 1.2rem;">0</span> XP
            </div>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('solo', this)">👤 التحدي الفردي</button>
            <button class="tab-btn" onclick="switchTab('multi', this)">⚔️ الساحة العالمية</button>
            <button class="tab-btn" onclick="switchTab('store', this)">🛒 متجر النخبة</button>
        </div>

        <div id="tab-solo" class="tab-content active game-card">
            <h2 style="color: var(--accent);">فك الشفرة</h2>
            <div class="word-display" id="solo-scrambled">----</div>
            <input type="text" id="solo-guess" class="cyber-input" placeholder="أدخل الكلمة الصحيحة..." style="max-width: 400px;">
            <button class="cyber-btn btn-gold" onclick="checkSolo()" style="max-width: 400px;">تحقق من الحل</button>
        </div>

        <div id="tab-multi" class="tab-content game-card">
            <h2 style="color: var(--primary);">الساحة العالمية (Online)</h2>
            <div id="multi-lobby">
                <p>أدخل كود الغرفة للانضمام أو إنشائها</p>
                <input type="text" id="room-code" class="cyber-input" placeholder="كود الغرفة (مثلاً: 777)" style="max-width: 300px;">
                <button class="cyber-btn btn-primary" onclick="joinRoom()" style="max-width: 300px;">دخول الساحة</button>
            </div>
            <div id="multi-arena" class="hidden">
                <div style="margin-bottom: 20px; color: #aaa; font-size: 0.9rem;">الغرفة الحالية: <span id="current-room-id" style="color: var(--primary); font-weight: bold;"></span></div>
                <div id="game-log" style="height: 30px; color: var(--accent); font-weight: bold; margin-bottom: 10px;"></div>
                <div class="word-display" id="multi-scrambled" style="font-size: 3rem;">----</div>
                <input type="text" id="multi-guess" class="cyber-input" placeholder="سابق المنافسين!" style="max-width: 400px;">
                <button class="cyber-btn btn-primary" onclick="checkMulti()" style="max-width: 400px;">إرسال الحل</button>
                <div id="players-list" style="margin-top: 30px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;"></div>
            </div>
        </div>

        <div id="tab-store" class="tab-content game-card">
            <h2 style="color: var(--accent);">متجر الترقيات</h2>
            <p style="color: #aaa; margin-bottom: 30px;">استخدم رصيدك لامتلاك أدوات حصرية</p>
            <div class="store-grid" id="store-container">
                </div>
        </div>
    </div>

    <script>
        // =========================================
        // ⚙️ الإعدادات الرئيسية (ضع رابطك هنا)
        // =========================================
        const DB = "https://your-firebase-id.firebaseio.com/nexus_system"; // 👈 رابط Firebase

        // حالة التطبيق
        let currentUser = null;
        let soloTarget = "";
        let multiTarget = "";
        let currentRoom = null;
        const shopItems = [
            { id: 1, name: "معزز الإشارة (XP Boost)", price: 1000, icon: "🚀" },
            { id: 2, name: "درع الحماية (Shield)", price: 2500, icon: "🛡️" },
            { id: 3, name: "شارة القراصنة (Badge)", price: 5000, icon: "💀" }
        ];

        // =========================================
        // 🔔 نظام الإشعارات (بديل الـ alert)
        // =========================================
        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        // =========================================
        // 🔐 نظام الدخول والهوية
        // =========================================
        async function attemptRegister() {
            const u = document.getElementById('u-name').value.trim();
            const p = document.getElementById('u-pass').value;
            if(!u || !p) return showToast("يرجى إكمال البيانات!", "error");
            
            showToast("جاري التحقق...", "gold");
            const res = await fetch(`${DB}/users/${u}.json`);
            if(await res.json()) return showToast("اسم المستخدم محجوز مسبقاً!", "error");

            await fetch(`${DB}/users/${u}.json`, { method: 'PUT', body: JSON.stringify({ pass: btoa(p), xp: 50, inventory: [] }) });
            showToast("تم إنشاء الهوية بنجاح! يمكنك الدخول.", "success");
        }

        async function attemptLogin(autoUser = null) {
            const u = autoUser || document.getElementById('u-name').value.trim();
            const p = autoUser ? localStorage.getItem('nexus_pass') : document.getElementById('u-pass').value;
            if(!u || !p) return showToast("بيانات الدخول ناقصة!", "error");

            if(!autoUser) showToast("جاري الاتصال بالسيرفر...", "gold");
            const res = await fetch(`${DB}/users/${u}.json`);
            const data = await res.json();

            if(data && data.pass === (autoUser ? p : btoa(p))) {
                currentUser = { name: u, ...data };
                if(!autoUser) {
                    localStorage.setItem('nexus_user', u);
                    localStorage.setItem('nexus_pass', data.pass);
                }
                launchApp();
            } else {
                if(!autoUser) showToast("خطأ في اسم المستخدم أو كلمة المرور!", "error");
            }
        }

        // الدخول التلقائي عند فتح الصفحة
        window.addEventListener('load', () => {
            const savedUser = localStorage.getItem('nexus_user');
            if(savedUser) attemptLogin(savedUser);
        });

        function launchApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            updateUI();
            nextSoloWord();
            renderShop();
            showToast(`أهلاً بك في النظام، ${currentUser.name}`, "success");
        }

        // =========================================
        // 🎮 منطق اللعبة (الفردي)
        // =========================================
        function nextSoloWord() {
            const words = ["سايبر", "مستقبل", "تشفير", "شبكة", "بيانات", "هوية"];
            soloTarget = words[Math.floor(Math.random() * words.length)];
            document.getElementById('solo-scrambled').innerText = soloTarget.split('').sort(() => Math.random() - 0.5).join('');
        }

        async function checkSolo() {
            const guess = document.getElementById('solo-guess').value.trim();
            if(guess === soloTarget) {
                currentUser.xp += 100;
                showToast("إجابة صحيحة! +100 XP", "gold");
                document.getElementById('solo-guess').value = "";
                nextSoloWord();
                await saveUserData();
            } else {
                showToast("محاولة خاطئة، ركز!", "error");
            }
        }

        // =========================================
        // ⚔️ منطق الأونلاين (المطور)
        // =========================================
        async function joinRoom() {
            const code = document.getElementById('room-code').value.trim();
            if(!code) return showToast("أدخل كود الغرفة أولاً!", "error");
            currentRoom = code;

            document.getElementById('multi-lobby').classList.add('hidden');
            document.getElementById('multi-arena').classList.remove('hidden');
            document.getElementById('current-room-id').innerText = code;

            // تسجيل الدخول للغرفة
            await fetch(`${DB}/rooms/${code}/players/${currentUser.name}.json`, { method: 'PUT', body: JSON.stringify({ xp: currentUser.xp }) });
            
            showToast("تم الاتصال بالغرفة! المنافسة تبدأ...", "success");
            setInterval(syncRoomState, 1500); // مزامنة سريعة
        }

        async function syncRoomState() {
            const res = await fetch(`${DB}/rooms/${currentRoom}.json`);
            const data = await res.json();
            if(!data) return;

            // تحديث الكلمة
            if(data.word && data.word !== multiTarget) {
                multiTarget = data.word;
                document.getElementById('multi-scrambled').innerText = data.scrambled;
                if(data.lastWinner) document.getElementById('game-log').innerText = `⚡ ${data.lastWinner} قام بحل الكلمة الأخيرة!`;
            } else if (!data.word) {
                generateRoomWord();
            }

            // تحديث قائمة اللاعبين
            const list = document.getElementById('players-list');
            list.innerHTML = Object.keys(data.players || {}).map(p => 
                `<span style="background:rgba(0,242,254,0.1); padding: 5px 15px; border-radius: 20px; border: 1px solid var(--primary); font-size: 0.9rem;">${p}</span>`
            ).join('');
        }

        async function generateRoomWord(winnerName = null) {
            const words = ["بروتوكول", "خوارزمية", "منصة", "سحابة"];
            const word = words[Math.floor(Math.random() * words.length)];
            const scrambled = word.split('').sort(() => Math.random() - 0.5).join('');
            await fetch(`${DB}/rooms/${currentRoom}.json`, { method: 'PATCH', body: JSON.stringify({ word, scrambled, lastWinner: winnerName }) });
        }

        async function checkMulti() {
            const guess = document.getElementById('multi-guess').value.trim();
            if(guess === multiTarget) {
                currentUser.xp += 250;
                showToast("أنت الأسرع! +250 XP", "gold");
                document.getElementById('multi-guess').value = "";
                // مسح الكلمة الحالية وتوليد جديدة باسم الفائز
                await fetch(`${DB}/rooms/${currentRoom}/word.json`, { method: 'DELETE' });
                generateRoomWord(currentUser.name);
                await saveUserData();
            }
        }

        // =========================================
        // 🛒 منطق المتجر (المتطور)
        // =========================================
        function renderShop() {
            const container = document.getElementById('store-container');
            const owned = currentUser.inventory || [];
            container.innerHTML = shopItems.map(item => {
                const isOwned = owned.includes(item.id);
                return `
                <div class="store-item ${isOwned ? 'owned' : ''}">
                    <div style="font-size: 3rem; margin-bottom: 10px;">${item.icon}</div>
                    <h3>${item.name}</h3>
                    <p style="color: var(--accent); font-weight: bold;">${item.price} XP</p>
                    <button class="cyber-btn ${isOwned ? '' : 'btn-primary'}" 
                            onclick="${isOwned ? '' : `buyItem(${item.id}, ${item.price})`}" 
                            ${isOwned ? 'disabled style="opacity:0.5; cursor:default;"' : ''}>
                        ${isOwned ? 'مملوك' : 'شراء الآن'}
                    </button>
                </div>`;
            }).join('');
        }

        async function buyItem(id, price) {
            if(currentUser.xp >= price) {
                currentUser.xp -= price;
                if(!currentUser.inventory) currentUser.inventory = [];
                currentUser.inventory.push(id);
                showToast("تم الشراء بنجاح! تمت إضافة العنصر.", "success");
                await saveUserData();
                renderShop();
            } else {
                showToast("رصيدك غير كافٍ لإتمام العملية!", "error");
            }
        }

        // =========================================
        // 🔄 دوال مساعدة (UI & Sync)
        // =========================================
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function updateUI() {
            document.getElementById('user-display').innerText = currentUser.name;
            document.getElementById('xp-display').innerText = currentUser.xp;
        }

        async function saveUserData() {
            updateUI();
            await fetch(`${DB}/users/${currentUser.name}.json`, { 
                method: 'PATCH', 
                body: JSON.stringify({ xp: currentUser.xp, inventory: currentUser.inventory }) 
            });
        }
    </script>
</body>
</html>
