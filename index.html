<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أساطير سايبر | Cyber Legends</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg: #050505;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 242, 254, 0.1) 0%, transparent 50%),
                linear-gradient(0deg, transparent 24%, rgba(0, 242, 254, .03) 25%, rgba(0, 242, 254, .03) 26%, transparent 27%, transparent 74%, rgba(0, 242, 254, .03) 75%, rgba(0, 242, 254, .03) 76%, transparent 77%, transparent);
            background-size: 100% 100%, 50px 50px;
        }

        .container {
            background: var(--glass);
            padding: 2rem;
            border-radius: 20px;
            border: 1px solid var(--primary);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.2);
            text-align: center;
            width: 90%;
            max-width: 400px;
            backdrop-filter: blur(10px);
            position: relative;
        }

        /* اللوجو */
        .game-logo {
            width: 120px;
            height: 120px;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 15px var(--primary));
            border-radius: 50%;
            border: 2px solid var(--primary);
            object-fit: cover;
        }

        h1 {
            color: var(--primary);
            margin: 0;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--primary);
        }

        input {
            width: 80%;
            padding: 15px;
            margin: 20px 0;
            background: rgba(0,0,0,0.5);
            border: 2px solid #333;
            color: white;
            border-radius: 10px;
            font-size: 18px;
            text-align: center;
            transition: 0.3s;
            font-family: 'Cairo', sans-serif;
        }

        input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        button {
            background: linear-gradient(45deg, var(--secondary), var(--primary));
            border: none;
            padding: 15px 40px;
            color: #000;
            font-weight: bold;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            font-family: 'Cairo', sans-serif;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--primary);
        }

        .hidden { display: none; }
        
        .xp-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 242, 254, 0.2);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            font-size: 14px;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
            min-height: 25px;
        }

        .word-box {
            font-size: 24px;
            letter-spacing: 5px;
            margin: 20px 0;
            color: var(--secondary);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container" id="loginScreen">
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEj_g4h8fKz5Z4q2j7v8z2g4h8fKz5Z4q2j7v8z2g4h8fKz5Z4q2j7v8/s1600/logo_placeholder.png" alt="Logo" class="game-logo" id="logoImg">
        <h1>أساطير سايبر</h1>
        <p>سجل دخولك لبدء التحدي</p>
        <input type="text" id="username" placeholder="اكتب اسمك هنا...">
        <button onclick="login()">دخول النظام ⚡</button>
    </div>

    <div class="container hidden" id="gameScreen">
        <div class="xp-badge">XP: <span id="xpDisplay">0</span></div>
        <h2 style="color:var(--secondary)">خمن الكلمة!</h2>
        <div class="word-box" id="wordHint">_ _ _ _</div>
        <p id="hintText" style="font-size:14px; color:#aaa;"></p>
        <input type="text" id="guessInput" placeholder="اكتب تخمينك...">
        <button onclick="checkGuess()">تحقق 🎯</button>
        <div id="message"></div>
        <button onclick="logout()" style="background:transparent; border:1px solid #333; color:#aaa; margin-top:20px; font-size:14px;">تسجيل خروج</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        // ---------------------------------------------------------
        // هام جداً: استبدل المنطقة أدناه ببياناتك من Firebase
        // ---------------------------------------------------------
        const firebaseConfig = {
            apiKey: "ضع_الـ_API_KEY_هنا",
            authDomain: "ضع_الـ_AUTH_DOMAIN_هنا",
            databaseURL: "ضع_الـ_DATABASE_URL_هنا",
            projectId: "ضع_الـ_PROJECT_ID_هنا",
            storageBucket: "ضع_الـ_STORAGE_BUCKET_هنا",
            messagingSenderId: "ضع_الـ_SENDER_ID_هنا",
            appId: "ضع_الـ_APP_ID_هنا"
        };
        // ---------------------------------------------------------

        // تهيئة Firebase
        let db;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            console.log("Firebase Connected Successfully");
        } catch (error) {
            console.error("Firebase Error:", error);
            alert("خطأ في ربط قاعدة البيانات! تأكد من وضع الإعدادات الصحيحة في الكود.");
        }

        let currentUser = "";
        let currentXP = 0;

        // قائمة الكلمات (اللعبة)
        const words = [
            { word: "حاسوب", hint: "جهاز إلكتروني نستخدمه للبرمجة" },
            { word: "انترنت", hint: "شبكة عالمية تربط العالم" },
            { word: "سيرفر", hint: "خادم ضخم يحفظ البيانات" },
            { word: "هاكر", hint: "شخص يخترق الأنظمة الأمنية" },
            { word: "شاشة", hint: "جزء من الكمبيوتر يعرض الصورة" }
        ];
        let currentWordObj = {};

        function login() {
            const user = document.getElementById("username").value.trim();
            if (user === "") {
                alert("الرجاء كتابة اسم!");
                return;
            }
            
            // تحويل الاسم لصيغة مقبولة في قاعدة البيانات
            const safeUser = user.replace(/[.#$/[\]]/g, "_");
            currentUser = safeUser;

            // قراءة البيانات من Firebase
            db.ref('users/' + safeUser).once('value', (snapshot) => {
                if (snapshot.exists()) {
                    currentXP = snapshot.val().xp;
                    alert("مرحباً بعودتك يا " + user + "! رصيدك: " + currentXP);
                } else {
                    currentXP = 0;
                    db.ref('users/' + safeUser).set({ xp: 0 });
                    alert("حساب جديد! أهلاً بك يا " + user);
                }
                startGame();
            });
        }

        function startGame() {
            document.getElementById("loginScreen").classList.add("hidden");
            document.getElementById("gameScreen").classList.remove("hidden");
            
            // اختيار كلمة عشوائية
            const randomIndex = Math.floor(Math.random() * words.length);
            currentWordObj = words[randomIndex];
            
            // تحديث الشاشة
            updateXP();
            document.getElementById("wordHint").textContent = "_ ".repeat(currentWordObj.word.length);
            document.getElementById("hintText").textContent = "تلميح: " + currentWordObj.hint;
            document.getElementById("message").textContent = "";
        }

        function updateXP() {
            document.getElementById("xpDisplay").textContent = currentXP;
            // حفظ في Firebase
            if (currentUser) {
                db.ref('users/' + currentUser).update({ xp: currentXP });
            }
        }

        function checkGuess() {
            const input = document.getElementById("guessInput").value.trim().toLowerCase();
            const messageEl = document.getElementById("message");

            if (input === currentWordObj.word.toLowerCase()) {
                messageEl.textContent = "صح! 🎉 حصلت على 50 XP";
                messageEl.style.color = "#00f2fe";
                currentXP +=
