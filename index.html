<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER LEGENDS | النظام المتكامل</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2fe; --secondary: #4facfe; --gold: #ffd700; --danger: #ff4b2b;
            --bg: #050505; --glass: rgba(255, 255, 255, 0.07); --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; outline: none; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); color: white;
            min-height: 100vh; overflow-x: hidden;
            background-image: radial-gradient(circle at 10% 20%, rgba(0, 242, 254, 0.1) 0%, transparent 20%),
                              radial-gradient(circle at 90% 80%, rgba(79, 172, 254, 0.1) 0%, transparent 20%);
            animation: bgPulse 10s infinite alternate;
        }
        @keyframes bgPulse { 0% { background-size: 100% 100%; } 100% { background-size: 110% 110%; } }

        /* --- 🔔 نظام الإشعارات (Toast) --- */
        #toast-box { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; }
        .toast { background: rgba(20, 20, 30, 0.95); backdrop-filter: blur(10px); color: white; padding: 15px; border-radius: 12px; border-right: 5px solid var(--primary); box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: space-between; animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .toast.error { border-color: var(--danger); } .toast.gold { border-color: var(--gold); }
        @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* --- 🔐 شاشة الدخول الاحترافية --- */
        .auth-screen { position: fixed; inset: 0; background: rgba(5,5,5,0.9); backdrop-filter: blur(20px); z-index: 2000; display: flex; align-items: center; justify-content: center; transition: 0.5s; }
        .auth-card { background: var(--glass); border: 1px solid var(--border); padding: 40px; border-radius: 30px; width: 90%; max-width: 450px; text-align: center; box-shadow: 0 0 50px rgba(0, 242, 254, 0.1); position: relative; overflow: hidden; }
        .auth-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px; background: linear-gradient(90deg, var(--primary), var(--secondary)); }
        
        .input-group { margin: 20px 0; position: relative; }
        .cyber-input { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid #333; padding: 15px; border-radius: 12px; color: white; font-size: 1rem; transition: 0.3s; text-align: center; }
        .cyber-input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 242, 254, 0.2); }
        
        .cyber-btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: 900; font-size: 1.1rem; cursor: pointer; transition: 0.3s; position: relative; overflow: hidden; }
        .btn-main { background: linear-gradient(45deg, var(--primary), var(--secondary)); color: #000; }
        .btn-gold { background: linear-gradient(45deg, var(--gold), #ffae00); color: #000; }
        .cyber-btn:hover { transform: translateY(-3px); filter: brightness(1.2); }
        .cyber-btn:active { transform: scale(0.98); }

        .auth-switch { margin-top: 20px; color: #888; font-size: 0.9rem; cursor: pointer; text-decoration: underline; }

        /* --- 🎮 واجهة اللعب --- */
        .app-container { max-width: 800px; margin: 0 auto; padding: 20px; display: none; opacity: 0; transition: 1s; }
        .app-container.visible { display: block; opacity: 1; }

        .header-bar { display: flex; justify-content: space-between; align-items: center; background: var(--glass); padding: 15px 25px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 30px; }
        .user-info { display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .avatar { width: 40px; height: 40px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: black; font-weight: 900; }

        .nav-dock { display: flex; gap: 15px; justify-content: center; margin-bottom: 30px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 20px; width: fit-content; margin-left: auto; margin-right: auto; }
        .dock-btn { background: transparent; border: none; color: #666; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 12px; transition: 0.3s; }
        .dock-btn.active { background: var(--glass); color: white; box-shadow: 0 0 15px rgba(255,255,255,0.05); }

        .tab-content { display: none; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .tab-content.active { display: block; }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .game-box { background: var(--glass); border: 1px solid var(--border); border-radius: 30px; padding: 40px 20px; text-align: center; position: relative; }
        .word-display { font-size: 3.5rem; font-weight: 900; color: var(--gold); letter-spacing: 10px; margin: 20px 0; text-shadow: 0 0 30px rgba(255, 215, 0, 0.3); }

        .store-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .store-item { background: rgba(255,255,255,0.03); padding: 20px; border-radius: 15px; border: 1px solid var(--border); transition: 0.3s; text-align: center; }
        .store-item:hover { border-color: var(--primary); transform: translateY(-5px); }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="toast-box"></div>

    <div id="auth-screen" class="auth-screen">
        <div class="auth-card">
            <h1 style="background: -webkit-linear-gradient(var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 2.5rem; margin-bottom: 10px;">CYBER LOGIN</h1>
            <p style="color: #aaa; margin-bottom: 30px;">بوابتك نحو التحدي</p>
            
            <input type="text" id="username" class="cyber-input" placeholder="اسم المستخدم" autocomplete="off">
            <div class="input-group">
                <input type="password" id="password" class="cyber-input" placeholder="كلمة المرور">
            </div>
            
            <button class="cyber-btn btn-main" onclick="handleLogin()">دخول النظام</button>
            <div class="auth-switch" onclick="toggleAuthMode()">ليس لديك حساب؟ إنشاء حساب جديد</div>
        </div>
    </div>

    <div id="app" class="app-container">
        <div class="header-bar">
            <div class="user-info">
                <div class="avatar" id="avatar-char">?</div>
                <div>
                    <div id="display-name" style="font-size: 0.9rem; color: #aaa;">Guest</div>
                    <div id="display-xp" style="color: var(--primary); font-size: 1.2rem;">0 XP</div>
                </div>
            </div>
            <button onclick="logout()" style="background: none; border: 1px solid #333; color: #ff4b2b; padding: 5px 15px; border-radius: 8px; cursor: pointer;">خروج</button>
        </div>

        <div class="nav-dock">
            <button class="dock-btn active" onclick="switchTab('solo', this)">👤 فردي</button>
            <button class="dock-btn" onclick="switchTab('multi', this)">⚔️ أونلاين</button>
            <button class="dock-btn" onclick="switchTab('store', this)">🛒 المتجر</button>
        </div>

        <div id="tab-solo" class="tab-content active">
            <div class="game-box">
                <h2 style="color: var(--secondary)">فك التشفير</h2>
                <div class="word-display" id="solo-word">----</div>
                <input type="text" id="solo-input" class="cyber-input" placeholder="أدخل الكلمة هنا..." style="max-width: 400px; margin-bottom: 20px;">
                <button class="cyber-btn btn-gold" onclick="checkSolo()" style="max-width: 200px;">تحقق</button>
            </div>
        </div>

        <div id="tab-multi" class="tab-content">
            <div class="game-box">
                <h2 style="color: var(--primary)">الساحة العالمية</h2>
                
                <div id="room-login">
                    <p style="color:#888">أدخل كود الروم للعب مع صديقك</p>
                    <input type="text" id="room-code" class="cyber-input" placeholder="رقم الغرفة (مثلاً 5050)" style="max-width: 300px; margin-bottom: 20px;">
                    <button class="cyber-btn btn-main" onclick="joinRoom()" style="max-width: 200px;">اتصال</button>
                </div>

                <div id="room-arena" class="hidden">
                    <div style="margin-bottom: 10px; color: #666;">الغرفة: <span id="current-room-id" style="color:white">--</span></div>
                    <div id="game-status" style="height: 20px; color: var(--gold); font-size: 0.9rem; margin-bottom: 10px;"></div>
                    <div class="word-display" id="multi-word">----</div>
                    <input type="text" id="multi-input" class="cyber-input" placeholder="سابق الزمن..." style="max-width: 400px; margin-bottom: 20px;">
                    <button class="cyber-btn btn-main" onclick="checkMulti()" style="max-width: 200px;">إرسال</button>
                    
                    <div style="margin-top: 30px; border-top: 1px solid #333; padding-top: 10px;">
                        <p style="font-size: 0.8rem; color: #666;">المتواجدون الآن:</p>
                        <div id="players-list" style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="tab-store" class="tab-content">
            <div class="store-grid" id="store-container">
                </div>
        </div>
    </div>
<script>
    // ============================================
    // ⚙️ الإعدادات (تم تحديث الرابط الخاص بك هنا)
    // ============================================
    const DB_URL = "https://cyberlegends-e5a69-default-rtdb.firebaseio.com"; 

    // حالة التطبيق
    let currentUser = null;
    let isRegisterMode = false;
<    // 1. إدارة الإشعارات (بديلة الـ alert)
    function notify(msg, type = 'normal') {
        const box = document.getElementById('toast-box');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `<span>${msg}</span> <span>✖</span>`;
        box.appendChild(toast);
        setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 400); }, 3000);
    }

    // 2. إدارة الدخول (Auth)
    function toggleAuthMode() {
        isRegisterMode = !isRegisterMode;
        const btn = document.querySelector('.auth-switch');
        const mainBtn = document.querySelector('.auth-screen .btn-main');
        
        if(isRegisterMode) {
            mainBtn.innerText = "إنشاء حساب جديد";
            btn.innerText = "لديك حساب بالفعل؟ تسجيل دخول";
        } else {
            mainBtn.innerText = "دخول النظام";
            btn.innerText = "ليس لديك حساب؟ إنشاء حساب جديد";
        }
    }

    async function handleLogin() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value;
        if(!u || !p) return notify("الرجاء تعبئة جميع الحقول", "error");

        notify("جاري الاتصال بالسيرفر...", "normal");

        try {
            const res = await fetch(`${DB_URL}/users/${u}.json`);
            const data = await res.json();

            if (isRegisterMode) {
                if(data) return notify("اسم المستخدم محجوز!", "error");
                const newUser = { pass: btoa(p), xp: 50, inventory: [] };
                await fetch(`${DB_URL}/users/${u}.json`, { method: 'PUT', body: JSON.stringify(newUser) });
                notify("تم إنشاء الحساب! جاري الدخول...", "gold");
                loginSuccess(u, newUser);
            } else {
                if(data && data.pass === btoa(p)) {
                    notify("تم تسجيل الدخول بنجاح", "gold");
                    loginSuccess(u, data);
                } else {
                    notify("اسم المستخدم أو كلمة المرور خطأ", "error");
                }
            }
        } catch(e) { notify("خطأ في الاتصال! تأكد من الرابط", "error"); }
    }

    function loginSuccess(name, data) {
        currentUser = { name: name, ...data };
        localStorage.setItem('cyber_user', name); // حفظ الجلسة
        
        document.getElementById('auth-screen').style.opacity = '0';
        setTimeout(() => document.getElementById('auth-screen').style.display = 'none', 500);
        
        document.getElementById('app').classList.add('visible');
        updateUI();
        initGame();
    }

    function logout() {
        localStorage.removeItem('cyber_user');
        location.reload();
    }

    // التحقق من الجلسة المحفوظة عند الفتح
    window.onload = async () => {
        const saved = localStorage.getItem('cyber_user');
        if(saved) {
            const res = await fetch(`${DB_URL}/users/${saved}.json`);
            const data = await res.json();
            if(data) loginSuccess(saved, data);
        }
    }

    // 3. واجهة المستخدم
    function updateUI() {
        document.getElementById('display-name').innerText = currentUser.name;
        document.getElementById('display-xp').innerText = `${currentUser.xp} XP`;
        document.getElementById('avatar-char').innerText = currentUser.name.charAt(0).toUpperCase();
        renderStore();
    }

    function switchTab(tab, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.getElementById(`tab-${tab}`).classList.add('active');
        document.querySelectorAll('.dock-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    // 4. اللعب الفردي
    function initGame() {
        const words = ["حاسوب", "ذكاء", "شبكة", "نظام", "كود", "بيانات"];
        soloTarget = words[Math.floor(Math.random() * words.length)];
        document.getElementById('solo-word').innerText = soloTarget.split('').sort(()=>Math.random()-0.5).join('');
    }

    async function checkSolo() {
        const val = document.getElementById('solo-input').value.trim();
        if(val === soloTarget) {
            currentUser.xp += 100;
            notify("إجابة صحيحة! +100 XP", "gold");
            document.getElementById('solo-input').value = "";
            initGame();
            await saveProgress();
        } else {
            notify("إجابة خاطئة!", "error");
        }
    }

    // 5. اللعب الجماعي (روم)
    async function joinRoom() {
        const code = document.getElementById('room-code').value.trim();
        if(!code) return notify("أدخل كود الغرفة", "error");
        
        currentRoomCode = code;
        document.getElementById('room-login').classList.add('hidden');
        document.getElementById('room-arena').classList.remove('hidden');
        document.getElementById('current-room-id').innerText = code;
        
        // تسجيل الدخول للروم
        await fetch(`${DB_URL}/rooms/${code}/players/${currentUser.name}.json`, { method: 'PUT', body: JSON.stringify({ xp: currentUser.xp }) });
        
        notify("تم الاتصال بالغرفة", "gold");
        setInterval(syncRoom, 1500);
    }

    async function syncRoom() {
        const res = await fetch(`${DB_URL}/rooms/${currentRoomCode}.json`);
        const data = await res.json();
        if(!data) return;

        // اللاعبين
        const playersDiv = document.getElementById('players-list');
        playersDiv.innerHTML = Object.keys(data.players || {}).map(p => 
            `<span style="background:#333; padding:5px 10px; border-radius:5px; font-size:0.8rem; border:1px solid #555">${p}</span>`
        ).join('');

        // الكلمة
        if(data.word && data.word !== multiTarget) {
            multiTarget = data.word;
            document.getElementById('multi-word').innerText = data.scrambled;
            document.getElementById('game-status').innerText = data.winner ? `👑 الفائز بالجولة: ${data.winner}` : "جولة جديدة!";
        } else if(!data.word) {
            // أنا المسؤول عن إنشاء كلمة جديدة إذا كانت فارغة
            const w = ["سيرفر", "تطبيق", "منصة", "حماية"];
            const real = w[Math.floor(Math.random()*w.length)];
            const scram = real.split('').sort(()=>Math.random()-0.5).join('');
            await fetch(`${DB_URL}/rooms/${currentRoomCode}.json`, { method: 'PATCH', body: JSON.stringify({ word: real, scrambled: scram, winner: null }) });
        }
    }

    async function checkMulti() {
        if(document.getElementById('multi-input').value.trim() === multiTarget) {
            currentUser.xp += 200;
            notify("أنت الأسرع! +200 XP", "gold");
            document.getElementById('multi-input').value = "";
            
            // مسح الكلمة لإعلام الجميع بالفوز
            await fetch(`${DB_URL}/rooms/${currentRoomCode}.json`, { method: 'PATCH', body: JSON.stringify({ word: null, winner: currentUser.name }) });
            await saveProgress();
        }
    }

    // 6. المتجر والحفظ
    async function saveProgress() {
        updateUI();
        await fetch(`${DB_URL}/users/${currentUser.name}.json`, { method: 'PATCH', body: JSON.stringify({ xp: currentUser.xp, inventory: currentUser.inventory }) });
    }

    function renderStore() {
        const items = [
            { id: 1, name: "مضاعف XP", price: 1000, icon: "⚡" },
            { id: 2, name: "درع الحماية", price: 2500, icon: "🛡️" },
            { id: 3, name: "تاج الملك", price: 5000, icon: "👑" }
        ];
        const owned = currentUser.inventory || [];
        
        document.getElementById('store-container').innerHTML = items.map(item => {
            const isOwned = owned.includes(item.id);
            return `
            <div class="store-item" style="${isOwned ? 'opacity:0.6; border-color:var(--gold)' : ''}">
                <div style="font-size:2.5rem">${item.icon}</div>
                <h3>${item.name}</h3>
                <p style="color:var(--primary)">${item.price} XP</p>
                <button class="cyber-btn ${isOwned ? '' : 'btn-main'}" onclick="buy(${item.id}, ${item.price})" ${isOwned ? 'disabled' : ''}>
                    ${isOwned ? 'تم الامتلاك' : 'شراء'}
                </button>
            </div>`;
        }).join('');
    }

    async function buy(id, price) {
        if(currentUser.xp >= price) {
            currentUser.xp -= price;
            if(!currentUser.inventory) currentUser.inventory = [];
            currentUser.inventory.push(id);
            notify("تم الشراء بنجاح!", "gold");
            await saveProgress();
        } else {
            notify("رصيدك غير كافٍ!", "error");
        }
    }
</script>
</body>
</html>
