<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>WORD SCRAMBLE v1000 - ULTIMATE HARD</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffcf33; --neon: #00f2fe; --bg: #020202; --card: rgba(255,255,255,0.05); }
        body { 
            margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); color: white;
            height: 100vh; display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .app-card {
            background: var(--card); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.1);
            padding: 40px; border-radius: 30px; width: 550px; text-align: center;
            box-shadow: 0 0 100px rgba(0,0,0,1);
        }
        .difficulty-shifter {
            display: flex; gap: 10px; justify-content: center; margin-bottom: 25px;
        }
        .diff-btn {
            padding: 8px 15px; border-radius: 8px; border: 1px solid #444; background: transparent;
            color: #aaa; cursor: pointer; transition: 0.3s; font-size: 13px;
        }
        .diff-btn.active { background: var(--neon); color: black; border-color: var(--neon); box-shadow: 0 0 15px var(--neon); }
        
        .word-box {
            font-size: 4.5rem; font-weight: 900; color: var(--gold); letter-spacing: 12px;
            margin: 20px 0; text-shadow: 0 0 30px rgba(255, 207, 51, 0.3); user-select: none;
        }
        input {
            width: 100%; padding: 18px; border-radius: 12px; border: 1px solid #333;
            background: rgba(0,0,0,0.8); color: white; font-size: 1.5rem; text-align: center;
            margin-bottom: 20px; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--neon); }
        
        .btn-main {
            width: 100%; padding: 18px; border-radius: 12px; border: none;
            background: linear-gradient(90deg, #ffcf33, #ffae00); color: black;
            font-weight: 900; font-size: 1.2rem; cursor: pointer; transition: 0.4s;
        }
        .btn-main:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(255,207,51,0.4); }

        .leaderboard { margin-top: 30px; text-align: right; font-size: 0.9rem; }
        .row { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .hidden { display: none !important; }
        .dev-badge { background: #ff4b2b; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; margin-right: 5px; }
    </style>
</head>
<body>

<div class="app-card" id="auth-box">
    <h1 style="color:var(--gold)">لعبه تخمين الكلمات</h1>
    <input type="text" id="u-in" placeholder="اسم المستخدم">
    <input type="password" id="p-in" placeholder="كلمة المرور">
    <button class="btn-main" onclick="processAuth()">تسجيل الدخول</button>
    <p style="font-size: 12px; cursor:pointer; margin-top:15px; color:#777" onclick="switchAuth()">ليس لديك ملف؟ أنشئ واحداً</p>
</div>

<div class="app-card hidden" id="game-box">
    <div class="difficulty-shifter">
        <button class="diff-btn active" onclick="setDiff('easy', this)">سهل</button>
        <button class="diff-btn" onclick="setDiff('medium', this)">متوسط</button>
        <button class="diff-btn" onclick="setDiff('hard', this)">صعب</button>
        <button class="diff-btn" onclick="setDiff('insane', this)">مستحيل</button>
    </div>

    <div style="display:flex; justify-content: space-between; font-weight: bold; font-size: 14px;">
        <span id="display-name"></span>
        <span style="color:var(--neon)">XP: <span id="xp-val">0</span>/1000</span>
    </div>

    <div class="word-box" id="scrambled-target">----</div>
    <input type="text" id="user-ans" placeholder="خمن الاسم..." autocomplete="off">
    <button class="btn-main" onclick="verifyGuess()">تحقق من التسلسل</button>

    <div class="leaderboard">
        <h4 style="color:var(--gold); border-bottom: 1px solid #333; padding-bottom: 5px;">🏆 قائمة النخبة</h4>
        <div id="lb-data"></div>
    </div>
</div>

<script>
    // الحماية والتشفير
    const _DEV = btoa("team");
    let isReg = false;
    let currentXP = 0;
    let activeWord = "";
    let difficulty = 'easy';
    let sessionUser = "";

    const dictionary = {
        easy: ["تفاح", "موز", "كتاب", "قلم", "شمس", "بحر", "بيت", "نجم"],
        medium: ["برمجة", "حاسوب", "شاشة", "موقع", "بيانات", "مستقبل", "تقنية"],
        hard: ["خوارزمية", "استراتيجية", "بيروقراطية", "ديمقراطية", "ميتافيزيقيا"],
        insane: ["أنثروبولوجيا", "سوسيولوجيا", "إمبريالية", "ببليوغرافيا", "أيديولوجيا"]
    };

    function setDiff(level, btn) {
        difficulty = level;
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        generateNew();
    }

    function switchAuth() {
        isReg = !isReg;
        document.querySelector('#auth-box h1').innerText = isReg ? "إنشاء حساب جديد" : "تخمين الكلمات";
    }

    function processAuth() {
        const u = document.getElementById('u-in').value;
        const p = document.getElementById('p-in').value;

        if (btoa(u) === _DEV && btoa(p) === _DEV) {
            initGame(u, true);
        } else if (isReg) {
            localStorage.setItem("vx_" + btoa(u), btoa(p));
            alert(" تم حفظ حسابك."); switchAuth();
        } else {
            if (localStorage.getItem("vx_" + btoa(u)) === btoa(p)) {
                initGame(u, false);
            } else { alert("خطأ في بيانات الدخول!"); }
        }
    }

    function initGame(u, dev) {
        sessionUser = u;
        document.getElementById('auth-box').classList.add('hidden');
        document.getElementById('game-box').classList.remove('hidden');
        document.getElementById('display-name').innerHTML = dev ? `<span class="dev-badge">DEV</span> ${u}` : u;
        updateRankings();
        generateNew();
    }

    function generateNew() {
        const list = dictionary[difficulty];
        activeWord = list[Math.floor(Math.random() * list.length)];
        let scrambled = activeWord.split('').sort(() => Math.random() - 0.5).join('');
        if(scrambled === activeWord) return generateNew();
        document.getElementById('scrambled-target').innerText = scrambled;
        document.getElementById('user-ans').value = "";
    }

    function verifyGuess() {
        const guess = document.getElementById('user-ans').value.trim();
        if (guess === activeWord) {
            // نقاط الصعوبة
            let points = difficulty === 'easy' ? 10 : difficulty === 'medium' ? 30 : difficulty === 'hard' ? 60 : 150;
            currentXP += points;
            document.getElementById('xp-val').innerText = currentXP;
            saveStats();
            if (currentXP >= 1000) { alert("مبروك! لقد سحقت النظام."); location.reload(); }
            else generateNew();
        } else {
            alert("فشل في تخمين الكلمه!");
        }
    }

    function saveStats() {
        let lb = JSON.parse(localStorage.getItem('luxury_v1000_lb')) || [];
        let idx = lb.findIndex(x => x.n === sessionUser);
        if (idx > -1) { if(currentXP > lb[idx].s) lb[idx].s = currentXP; }
        else lb.push({n: sessionUser, s: currentXP});
        lb.sort((a,b) => b.s - a.s);
        localStorage.setItem('luxury_v1000_lb', JSON.stringify(lb.slice(0, 5)));
        updateRankings();
    }

    function updateRankings() {
        let lb = JSON.parse(localStorage.getItem('luxury_v1000_lb')) || [];
        document.getElementById('lb-data').innerHTML = lb.map((p, i) => `
            <div class="row"><span>${i+1}. ${p.n}</span><span style="color:var(--neon)">${p.s} XP</span></div>
        `).join('');
    }

    // نظام حماية متقدم
    document.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('keydown', e => {
        if(e.key === 'Enter') verifyGuess();
        if(e.ctrlKey && (e.key === 'i' || e.key === 'j' || e.key === 'u')) e.preventDefault();
    });
</script>
</body>
</html>
